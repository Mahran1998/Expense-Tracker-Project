name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Prepare env
        run: cp .env.example .env

      - name: Build & start stack
        run: make up

      - name: Smoke test
        run: make smoke

      - name: Collect diagnostics
        if: always()
        run: make diag

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            compose-ps.txt
            compose-logs.txt

      - name: Cleanup
        if: always()
        run: make reset
